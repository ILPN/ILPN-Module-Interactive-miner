<div fxLayout="column" fxLayoutAlign="start stretch" class="height-100 width-100" (click)="cancelSelection()">
    <div fxLayout="row" fxLayoutAlign="end center" class="detail-area-toggle">
        <mat-button-toggle-group [formControl]="fcCumulative" aria-label="absolute/cumulative values">
            <mat-button-toggle value="absolute">absolute</mat-button-toggle>
            <mat-button-toggle value="cumulative">cumulative</mat-button-toggle>
        </mat-button-toggle-group>
    </div>
    <div fxLayout="row" fxLayoutAlign="start center" class="detail-area-select-all">
        <input type="checkbox" class="checkbox-margin" fxFlexAlign="center" [formControl]="fcSelectAll" (change)="selectAllChanged()">
        <span>select all</span>
    </div>

    <div gdColumns="48px auto" class="width-100 height-100">
        <ngx-slider [options]="sliderOptions" [formControl]="fcSlider"
                    class="height-100" [gdRow]="buttons | sliderGridRow" gdColumn="1"></ngx-slider>
        <app-graph-bar *ngFor="let config of buttons; let i = index" class="width-100"
                       [config]="config"
                       [cumulative]="cumulative"
                       [total]="total"
                       [maximum]="maximum"
                       (selected)="processCheckboxChange(i, $event)"
                       (clicked)="modelClicked(i)"
                       [gdRow]="i | graphBarRow"
                       gdColumn="2"></app-graph-bar>
    </div>
</div>

<ng-content></ng-content>
